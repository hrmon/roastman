$kind: http-request
name: Get User
url: "{{base_url}}/users/2"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Path is /users/2", function () {
        pm.expect(pm.response.json().path).to.eql("/users/2");
      });
    language: text/javascript
order: 2000
