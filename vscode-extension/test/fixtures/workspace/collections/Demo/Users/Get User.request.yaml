$kind: http-request
url: "{{base_url}}/users/1"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Path is /users/1", function () {
        pm.expect(pm.response.json().path).to.eql("/users/1");
      });
    language: text/javascript
order: 1000
